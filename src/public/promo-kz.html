    * {

    @keyframes floatEmoji {
      0%, 100% {
        transform: translateY(0) scale(1) rotate(0deg);
        filter: drop-shadow(0 15px 25px rgba(37, 99, 235, 0.25));
      }
      50% {
        transform: translateY(-12px) scale(1.08) rotate(2deg);
        filter: drop-shadow(0 25px 35px rgba(37, 99, 235, 0.4));
      }
    }

    .animate-float {
      animation: floatEmoji 2.2s ease-in-out infinite;
    }

    @keyframes kineticUp {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);

          <span>GymConnect-ті Telegram-да ашу</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>

        <p class="text-[10.5px] text-center text-slate-400 font-medium tracking-tight">Келесі слайд үшін оң жаққа басыңыз • Тоқтату үшін басып тұрыңыз</p>

  <script>
    // Қазақ тіліндегі бекітілген 6 слайд
    const slides = [
      {
        badge: "ФИТНЕС ЭКОЖҮЙЕСІ",
        emoji: "⚡️",
        title: "GymConnect.kz",
        subtitle: "сенің фитнес әлемің",
        slogan: "Бұдан былай жалғыз жаттықпайсың.",
        accentColor: "from-blue-600 to-indigo-600"
      },
      {
        badge: "GYMBRO МОДУЛІ",
        emoji: "🤝",
        title: "Сенімді серік тап",
        subtitle: "өз фитнес-залыңнан",
        slogan: "Бірге жаттығу, салмақты ұстап беру және тәртіп.",
        accentColor: "from-emerald-500 to-teal-600"
      },
      {
        badge: "ШЫНАЙЫ РЕЙТИНГ",
        emoji: "⭐",
        title: "Пікірлер мен бағалар",
        subtitle: "өтіріксіз және жарнамасыз",
        slogan: "Алматының 230+ залдары мен бапкерлері жайлы адал баға.",
        accentColor: "from-amber-500 to-orange-600"
      },
      {
        badge: "БАПКЕРЛЕРГЕ АРНАЛҒАН",
        emoji: "📊",
        title: "Trainer CoachOS",
        subtitle: "бапкерге арналған CRM-жүйе",
        slogan: "Шәкірттер есебі, жаттығуларды шегеру және табыс 1 басуда.",
        accentColor: "from-indigo-600 to-violet-600"
      },
      {
        badge: "ЗАЛДАР ҮШІН",
        emoji: "🏢",
        title: "Абонементтерді сату",
        subtitle: "менеджерлердің қатысуынсыз",
        slogan: "Клиенттердің Telegram арқылы карталарды тікелей сатып алуы.",
        accentColor: "from-blue-700 to-cyan-600"
      },
      {
        badge: "ФИНАЛ",
        emoji: "❤️‍🔥",
        title: "GymConnect",
        subtitle: "біз барлық фитнесті біріктіреміз",
        slogan: "Қаланың басты спорттық қауымдастығына дәл қазір қосыл!",
        accentColor: "from-rose-500 to-red-600"
      }
    ];

    let currentSlide = 0;
    const slideDuration = 3000;
    let slideTimer = null;
    let progressStartTime = 0;
    let isPaused = false;
    let audioContext = null;
    let isMuted = true;
    let beatInterval = null;

    const slideContent = document.getElementById('slide-content');
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function playSwishSFX() {
      if (isMuted || !audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioContext.currentTime + 0.15);
      gain.gain.setValueAtTime(0.18, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.15);
    }

    function playClickSFX() {
      if (isMuted || !audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1400, audioContext.currentTime + 0.06);
      gain.gain.setValueAtTime(0.12, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.06);
    }

    function startBeat() {
      if (!audioContext || beatInterval) return;
      let step = 0;
      const intervalMs = (60 / 124) * 1000 / 2;
      beatInterval = setInterval(() => {
        if (isMuted) return;
        const now = audioContext.currentTime;
        if (step % 2 === 0) {
          const kick = audioContext.createOscillator();
          const gain = audioContext.createGain();
          kick.frequency.setValueAtTime(130, now);
          kick.frequency.exponentialRampToValueAtTime(38, now + 0.09);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          kick.connect(gain);
          gain.connect(audioContext.destination);
          kick.start(now);
          kick.stop(now + 0.09);
        }
        step++;
      }, intervalMs);
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isMuted = !isMuted;
      soundIcon.textContent = isMuted ? '🔇' : '🔊';
      if (!isMuted) {
        startBeat();
        playClickSFX();
      }
    });

    function renderSlide(index) {
      const data = slides[index];
      playSwishSFX();

      slideContent.innerHTML = `
        <div class="space-y-6 w-full kinetic-text">
          <div>
            <span class="inline-block px-3.5 py-1 bg-white border border-slate-200/80 shadow-sm rounded-full text-[10px] font-black tracking-widest text-slate-700 uppercase">
              ${data.badge}
            </span>
