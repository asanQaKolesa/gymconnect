<!-- public/promo-kz.html -->
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GymConnect.kz — Motion Showcase (QAZ)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #060911;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .studio-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    .word-mask {
      overflow: hidden;
      display: inline-block;
    }

    @keyframes textReveal {
      0% {
        transform: translateY(115%) rotate(4deg);
        opacity: 0;
        filter: blur(8px);
      }
      100% {
        transform: translateY(0%) rotate(0deg);
        opacity: 1;
        filter: blur(0px);
      }
    }

    .animate-reveal-1 {
      animation: textReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.05s;
    }
    .animate-reveal-2 {
      animation: textReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.18s;
    }
    .animate-reveal-3 {
      animation: textReveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.32s;
    }

    @keyframes epicPunch {
      0% {
        transform: scale(0.65) translateY(30px);
        opacity: 0;
        filter: blur(12px) drop-shadow(0 0 0 rgba(37,99,235,0));
      }
      60% {
        transform: scale(1.08) translateY(-6px);
        opacity: 1;
        filter: blur(0px) drop-shadow(0 20px 40px rgba(37,99,235,0.45));
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
        filter: drop-shadow(0 15px 30px rgba(37,99,235,0.35));
      }
    }

    .animate-punch {
      animation: epicPunch 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes flashFx {
      0% { opacity: 0.5; }
      100% { opacity: 0; }
    }
    .flash-overlay {
      animation: flashFx 0.35s ease-out forwards;
    }

    @keyframes waveBar {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-1 { animation: waveBar 0.55s ease-in-out infinite 0.1s; }
    .wave-2 { animation: waveBar 0.45s ease-in-out infinite 0.25s; }
    .wave-3 { animation: waveBar 0.65s ease-in-out infinite 0.05s; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

  <!-- 9:16 тік форматындағы мобильді моушн холст -->
  <div id="motion-stage" class="relative w-full max-w-[430px] h-[100dvh] max-h-[920px] bg-[#070A12] flex flex-col justify-between overflow-hidden shadow-2xl rounded-none sm:rounded-[40px] border-0 sm:border-[8px] sm:border-slate-800">
    
    <div class="absolute inset-0 studio-grid pointer-events-none opacity-40"></div>
    <div id="ambient-glow" class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/25 rounded-full blur-[110px] pointer-events-none transition-colors duration-700"></div>
    <div id="ambient-glow-2" class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-[110px] pointer-events-none transition-colors duration-700"></div>
    
    <div id="flash" class="absolute inset-0 bg-white pointer-events-none z-50 opacity-0"></div>

    <!-- Жоғарғы HUD жолағы -->
    <div class="relative z-40 p-4 pt-5 flex items-center justify-between">
      <a href="https://asanqakolesa.github.io/gymconnect/" class="flex items-center gap-2 group">
        <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-black text-xs tracking-tighter text-white shadow-lg shadow-blue-600/40">
          GC
        </div>
        <div class="leading-none">
          <p class="font-extrabold text-xs tracking-tight text-white">GymConnect<span class="text-blue-400">.kz</span></p>
          <p class="text-[9px] font-mono text-slate-400 uppercase tracking-widest mt-0.5">Motion 4K</p>
        </div>
      </a>

      <div class="flex items-center gap-2.5">
        <div class="flex items-center gap-0.5 h-4 px-1.5 py-0.5 bg-white/5 rounded-lg border border-white/10">
          <span class="w-0.5 bg-blue-400 rounded-full wave-1"></span>
          <span class="w-0.5 bg-blue-400 rounded-full wave-2"></span>
          <span class="w-0.5 bg-blue-400 rounded-full wave-3"></span>
        </div>

        <a href="https://asanqakolesa.github.io/gymconnect/promo-ru.html" class="px-2.5 py-1.5 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-xl text-[11px] font-bold border border-white/15 transition-all active:scale-95 text-white flex items-center gap-1">
          <span>🇷🇺</span>
          <span>РУС</span>
        </a>

        <button id="sound-btn" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/15 active:scale-95 transition-all">
          <span id="sound-icon" class="text-sm">🔇</span>
        </button>
      </div>
    </div>

    <!-- Орталық моушн-сахна -->
    <div class="relative z-30 flex-1 flex flex-col items-center justify-center px-6 text-center select-none" id="stage-content">
      <!-- Контент JavaScript арқылы салынады -->
    </div>

    <!-- Төменгі шақыру панелі -->
    <div class="relative z-40 p-5 pb-7 bg-gradient-to-t from-[#070A12] via-[#070A12]/90 to-transparent space-y-2.5">
      <a 
        href="https://t.me/gymconnect_almaty_bot" 
        target="_blank" 
        rel="noreferrer" 
        class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 shadow-xl shadow-blue-600/30 transition-all active:scale-98 border border-white/10"
      >
        <span>Telegram-да ашу</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </a>

      <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 px-1">
        <span id="scene-counter">SCENE 01 / 06</span>
        <span class="flex items-center gap-1 text-slate-400">
          <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-ping"></span>
          <span>AUTO PLAY</span>
        </span>
      </div>
    </div>

  </div>

  <script>
    // Қазақ тіліндегі бекітілген 6 сахна
    const scenes = [
      {
        tag: "ЭКОЖҮЙЕ",
        emoji: "⚡️",
        line1: "GymConnect.kz",
        line2: "сенің фитнес әлемің",
        slogan: "Бұдан былай жалғыз жаттықпайсың.",
        glow: "rgba(37, 99, 235, 0.4)",
        gradient: "from-blue-400 via-indigo-300 to-white"
      },
      {
        tag: "GYMBRO МОДУЛІ",
        emoji: "🤝",
        line1: "Сенімді серік тап",
        line2: "өз фитнес-залыңнан",
        slogan: "Салмақты ұстап беру • Тәртіп • Бірге жаттығу.",
        glow: "rgba(16, 185, 129, 0.4)",
        gradient: "from-emerald-400 via-teal-200 to-white"
      },
      {
        tag: "ШЫНАЙЫ ПІКІРЛЕР",
        emoji: "⭐",
        line1: "Адал бағалар",
        line2: "залдар мен бапкерлерге",
        slogan: "Жарнамасыз және өтіріксіз • 230+ фитнес-клуб.",
        glow: "rgba(245, 158, 11, 0.4)",
        gradient: "from-amber-400 via-orange-300 to-white"
      },
      {
        tag: "COACH OS CRM",
        emoji: "📊",
        line1: "Бапкерге арналған CRM",
        line2: "жұмысты жеңілдету",
        slogan: "Шәкірттер есебі, жаттығуларды шегеру және табыс.",
        glow: "rgba(99, 102, 241, 0.4)",
        gradient: "from-indigo-400 via-purple-300 to-white"
      },
      {
        tag: "ЗАЛДАР ҮШІН",
        emoji: "🏢",
        line1: "Абонементтер сату",
        line2: "менеджерсіз тікелей",
        slogan: "Карталарды Telegram арқылы 1 басуда сатып алу.",
        glow: "rgba(14, 165, 233, 0.4)",
        gradient: "from-sky-400 via-cyan-200 to-white"
      },
      {
        tag: "ФИНАЛ",
        emoji: "❤️‍🔥",
        line1: "GymConnect",
        line2: "барлық фитнесті біріктіреміз",
        slogan: "Қаланың ең мықты спорттық қауымдастығына қосыл!",
        glow: "rgba(244, 63, 94, 0.45)",
        gradient: "from-rose-400 via-red-300 to-white"
      }
    ];

    let currentSceneIdx = 0;
    const sceneInterval = 2800;
    let mainLoop = null;

    let audioCtx = null;
    let isMuted = true;
    let beatTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSceneImpact() {
      if (isMuted || !audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + 0.18);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);

      const bufferSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.12, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(now);
    }

    function startMusicBeat() {
      if (!audioCtx || beatTimer) return;
      let tick = 0;
      const ms = (60 / 126) * 1000 / 2;
      beatTimer = setInterval(() => {
        if (isMuted) return;
        const t = audioCtx.currentTime;
        if (tick % 2 === 0) {
          const hat = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          hat.type = 'highpass';
          hat.frequency.setValueAtTime(8000, t);
          g.gain.setValueAtTime(0.04, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          hat.connect(g);
          g.connect(audioCtx.destination);
          hat.start(t);
          hat.stop(t + 0.04);
        }
        tick++;
      }, ms);
    }

    function renderMotionScene(idx) {
      const data = scenes[idx];
      const stage = document.getElementById('stage-content');
      const counter = document.getElementById('scene-counter');
      const flash = document.getElementById('flash');
      const glow1 = document.getElementById('ambient-glow');

      flash.classList.remove('flash-overlay');
      void flash.offsetWidth;
      flash.classList.add('flash-overlay');
      playSceneImpact();

      glow1.style.backgroundColor = data.glow;
      counter.textContent = `SCENE 0${idx + 1} / 06`;

      stage.innerHTML = `
        <div class="space-y-6 w-full">
          
          <div class="word-mask">
            <span class="animate-reveal-1 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-white/10 border border-white/15 backdrop-blur-xl text-[10px] font-black tracking-widest uppercase text-white shadow-2xl">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
              ${data.tag}
            </span>
          </div>

          <div class="relative py-4 flex items-center justify-center">
            <div class="absolute w-44 h-44 rounded-full border border-white/10 animate-ping opacity-20 pointer-events-none"></div>
            <div class="absolute w-36 h-36 rounded-full bg-gradient-to-tr from-white/10 to-transparent blur-md pointer-events-none"></div>
            <div class="text-8xl sm:text-9xl animate-punch relative z-10">
              ${data.emoji}
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="word-mask block">
              <h1 class="animate-reveal-2 text-3xl sm:text-4xl font-black tracking-tight leading-none text-white">
                ${data.line1}
              </h1>
            </div>
            <div class="word-mask block">
              <p class="animate-reveal-3 text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r ${data.gradient} tracking-tight">
                ${data.line2}
              </p>
            </div>
          </div>

          <div class="word-mask pt-1">
            <p class="animate-reveal-3 text-xs sm:text-sm font-medium text-slate-300 max-w-[290px] mx-auto leading-relaxed">
              ${data.slogan}
            </p>
          </div>

        </div>
      `;
    }

    function runNext() {
      currentSceneIdx = (currentSceneIdx + 1) % scenes.length;
      renderMotionScene(currentSceneIdx);
    }

    function startAutoLoop() {
      if (mainLoop) clearInterval(mainLoop);
      mainLoop = setInterval(runNext, sceneInterval);
    }

    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isMuted = !isMuted;
      soundIcon.textContent = isMuted ? '🔇' : '🔊';
      if (!isMuted) {
        startMusicBeat();
        playSceneImpact();
      }
    });

    document.getElementById('motion-stage').addEventListener('click', () => {
      initAudio();
      runNext();
      startAutoLoop();
    });

    renderMotionScene(0);
    startAutoLoop();
  </script>
</body>
</html>
