<!-- public/promo-ru.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GymConnect.kz — Промо-презентация (RU)</title>
  
  <!-- Шрифт Rubik (поддерживает кириллицу) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            rubik: ['Rubik', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #0b0f19;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Анимация левитации 3D эмодзи */
    @keyframes floatEmoji {
      0%, 100% {
        transform: translateY(0) scale(1) rotate(0deg);
        filter: drop-shadow(0 15px 25px rgba(37, 99, 235, 0.25));
      }
      50% {
        transform: translateY(-12px) scale(1.08) rotate(2deg);
        filter: drop-shadow(0 25px 35px rgba(37, 99, 235, 0.4));
      }
    }

    .animate-float {
      animation: floatEmoji 2.2s ease-in-out infinite;
    }

    /* Кинетическая анимация появления текста */
    @keyframes kineticUp {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .kinetic-text {
      animation: kineticUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Прогресс-бар историй */
    .progress-track {
      background: rgba(255, 255, 255, 0.28);
      height: 3.5px;
      border-radius: 999px;
      overflow: hidden;
      flex: 1;
    }
    .progress-fill {
      background: #FFFFFF;
      height: 100%;
      width: 0%;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      transition: width 0.05s linear;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-900">

  <!-- Вертикальный формат 9:16 (Stories / Reels / TikTok) -->
  <div id="story-app" class="relative w-full max-w-[430px] h-[100dvh] max-h-[920px] bg-[#F8FAFC] flex flex-col justify-between overflow-hidden shadow-2xl rounded-none sm:rounded-[36px] border-0 sm:border-[8px] sm:border-slate-800">
    
    <!-- Верхний слой: 6 индикаторов и переключатель языка -->
    <div class="relative z-30 p-4 pt-5 space-y-3 bg-gradient-to-b from-black/40 via-black/10 to-transparent">
      <!-- 6 прогресс-баров по 3 секунды на слайд -->
      <div class="flex items-center gap-1.5 px-0.5" id="progress-container">
        <div class="progress-track"><div class="progress-fill" id="fill-0"></div></div>
        <div class="progress-track"><div class="progress-fill" id="fill-1"></div></div>
        <div class="progress-track"><div class="progress-fill" id="fill-2"></div></div>
        <div class="progress-track"><div class="progress-fill" id="fill-3"></div></div>
        <div class="progress-track"><div class="progress-fill" id="fill-4"></div></div>
        <div class="progress-track"><div class="progress-fill" id="fill-5"></div></div>
      </div>

      <!-- Хедер: Логотип, прямая ссылка на QAZ и Звук -->
      <div class="flex items-center justify-between text-white drop-shadow-md">
        <a href="https://asanqakolesa.github.io/gymconnect/" class="flex items-center gap-2 active:scale-95 transition-transform">
          <div class="w-7 h-7 rounded-xl bg-blue-600 flex items-center justify-center font-black text-xs tracking-tighter text-white shadow-lg">
            GC
          </div>
          <span class="font-extrabold text-sm tracking-tight">GymConnect<span class="text-blue-400">.kz</span></span>
        </a>

        <div class="flex items-center gap-2">
          <!-- ПРЯМАЯ ССЫЛКА НА КАЗАХСКУЮ ВЕРСИЮ GITHUB PAGES -->
          <a href="https://asanqakolesa.github.io/gymconnect/promo-kz.html" class="px-2.5 py-1 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-full text-[11px] font-bold border border-white/20 transition-all active:scale-95 text-white flex items-center gap-1">
            <span>🇰🇿</span>
            <span>QAZ</span>
          </a>

          <!-- Кнопка включения музыки и звуков -->
          <button id="sound-btn" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md flex items-center justify-center border border-white/20 active:scale-95 transition-all">
            <span id="sound-icon" class="text-sm">🔇</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Интерактивные зоны нажатия: слева - назад, справа - вперед -->
    <div class="absolute inset-0 z-10 flex">
      <div id="tap-left" class="w-1/3 h-full cursor-pointer"></div>
      <div id="tap-right" class="w-2/3 h-full cursor-pointer"></div>
    </div>

    <!-- Центральный визуальный блок -->
    <div class="relative z-20 flex-1 flex flex-col items-center justify-center px-6 text-center" id="slide-content">
      <!-- Контент монтируется скриптом -->
    </div>

    <!-- Нижняя панель действий -->
    <div class="relative z-30 p-5 pb-7 bg-gradient-to-t from-white via-white/90 to-transparent">
      <div id="action-container" class="space-y-2">
        <a href="https://t.me/gymconnect_almaty_bot" target="_blank" rel="noreferrer" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 transition-all active:scale-98">
          <span>Запустить GymConnect в Telegram</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </a>
        <p class="text-[10.5px] text-center text-slate-400 font-medium tracking-tight">Нажмите справа для следующего слайда • Зажмите для паузы</p>
      </div>
    </div>

  </div>

  <script>
    // 6 ключевых блоков на русском языке из утвержденного ТЗ
    const slides = [
      {
        badge: "ЭКОСИСТЕМА ФИТНЕСА",
        emoji: "⚡️",
        title: "GymConnect.kz",
        subtitle: "твой фитнес-мир",
        slogan: "Больше не тренируйся один.",
        accentColor: "from-blue-600 to-indigo-600"
      },
      {
        badge: "МОДУЛЬ GYMBRO",
        emoji: "🤝",
        title: "Найди напарника",
        subtitle: "в своем фитнес-зале",
        slogan: "Подстраховка на жиме, дисциплина и мотивация.",
        accentColor: "from-emerald-500 to-teal-600"
      },
      {
        badge: "ЧЕСТНЫЙ РЕЙТИНГ",
        emoji: "⭐",
        title: "Отзывы и оценки",
        subtitle: "без накруток и цензуры",
        slogan: "Достоверные мнения о тренерах и 230+ залах Алматы.",
        accentColor: "from-amber-500 to-orange-600"
      },
      {
        badge: "ДЛЯ ТРЕНЕРОВ",
        emoji: "📊",
        title: "Trainer CoachOS",
        subtitle: "CRM-система наставника",
        slogan: "Учет подопечных, списание занятий и касса в 1 клик.",
        accentColor: "from-indigo-600 to-violet-600"
      },
      {
        badge: "ДЛЯ ФИТНЕС-КЛУБОВ",
        emoji: "🏢",
        title: "Прямые продажи",
        subtitle: "без участия менеджеров",
        slogan: "Покупка абонементов клиентами напрямую в Telegram.",
        accentColor: "from-blue-700 to-cyan-600"
      },
      {
        badge: "ФИНАЛ",
        emoji: "❤️‍🔥",
        title: "GymConnect",
        subtitle: "мы объединяем весь фитнес",
        slogan: "Присоединяйся к главному спортивному комьюнити города!",
        accentColor: "from-rose-500 to-red-600"
      }
    ];

    let currentSlide = 0;
    const slideDuration = 3000;
    let slideTimer = null;
    let progressStartTime = 0;
    let isPaused = false;
    let audioContext = null;
    let isMuted = true;
    let beatInterval = null;

    const slideContent = document.getElementById('slide-content');
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');

    // Web Audio Синтезатор для музыки и звуков Swish / Click
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function playSwishSFX() {
      if (isMuted || !audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioContext.currentTime + 0.15);
      gain.gain.setValueAtTime(0.18, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.15);
    }

    function playClickSFX() {
      if (isMuted || !audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1400, audioContext.currentTime + 0.06);
      gain.gain.setValueAtTime(0.12, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.06);
    }

    function startBeat() {
      if (!audioContext || beatInterval) return;
      let step = 0;
      const intervalMs = (60 / 124) * 1000 / 2; // 124 BPM
      beatInterval = setInterval(() => {
        if (isMuted) return;
        const now = audioContext.currentTime;
        if (step % 2 === 0) {
          const kick = audioContext.createOscillator();
          const gain = audioContext.createGain();
          kick.frequency.setValueAtTime(130, now);
          kick.frequency.exponentialRampToValueAtTime(38, now + 0.09);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          kick.connect(gain);
          gain.connect(audioContext.destination);
          kick.start(now);
          kick.stop(now + 0.09);
        }
        step++;
      }, intervalMs);
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isMuted = !isMuted;
      soundIcon.textContent = isMuted ? '🔇' : '🔊';
      if (!isMuted) {
        startBeat();
        playClickSFX();
      }
    });

    // Отрисовка слайда
    function renderSlide(index) {
      const data = slides[index];
      playSwishSFX();

      slideContent.innerHTML = `
        <div class="space-y-6 w-full kinetic-text">
          <div>
            <span class="inline-block px-3.5 py-1 bg-white border border-slate-200/80 shadow-sm rounded-full text-[10px] font-black tracking-widest text-slate-700 uppercase">
              ${data.badge}
            </span>
          </div>

          <div class="py-2">
            <div class="text-8xl sm:text-9xl animate-float select-none">
              ${data.emoji}
            </div>
          </div>

          <div class="space-y-2">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight leading-none">
              ${data.title}
            </h1>
            <p class="text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r ${data.accentColor} tracking-tight">
              ${data.subtitle}
            </p>
          </div>

          <div class="pt-2">
            <p class="text-xs sm:text-sm font-medium text-slate-500 max-w-[280px] mx-auto leading-relaxed">
              ${data.slogan}
            </p>
          </div>
        </div>
      `;

      updateProgressBar();
    }

    function updateProgressBar() {
      slides.forEach((_, i) => {
        const fill = document.getElementById(`fill-${i}`);
        if (i < currentSlide) {
          fill.style.width = '100%';
        } else if (i === currentSlide) {
          fill.style.width = '0%';
        } else {
          fill.style.width = '0%';
        }
      });

      cancelAnimationFrame(slideTimer);
      progressStartTime = performance.now();

      function step(now) {
        if (!isPaused) {
          const elapsed = now - progressStartTime;
          const progress = Math.min((elapsed / slideDuration) * 100, 100);
          const currentFill = document.getElementById(`fill-${currentSlide}`);
          if (currentFill) currentFill.style.width = `${progress}%`;

          if (elapsed >= slideDuration) {
            nextSlide();
            return;
          }
        } else {
          progressStartTime = now - (parseFloat(document.getElementById(`fill-${currentSlide}`)?.style.width || 0) / 100) * slideDuration;
        }
        slideTimer = requestAnimationFrame(step);
      }
      slideTimer = requestAnimationFrame(step);
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      } else {
        currentSlide = 0;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      } else {
        currentSlide = 0;
        renderSlide(0);
      }
    }

    document.getElementById('tap-right').addEventListener('click', () => {
      initAudio();
      playClickSFX();
      nextSlide();
    });

    document.getElementById('tap-left').addEventListener('click', () => {
      initAudio();
      playClickSFX();
      prevSlide();
    });

    const storyApp = document.getElementById('story-app');
    storyApp.addEventListener('touchstart', () => { isPaused = true; });
    storyApp.addEventListener('touchend', () => { isPaused = false; });
    storyApp.addEventListener('mousedown', () => { isPaused = true; });
    storyApp.addEventListener('mouseup', () => { isPaused = false; });

    renderSlide(0);
  </script>
</body>
</html>
